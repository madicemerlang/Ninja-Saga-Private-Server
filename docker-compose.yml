services:
  mysql:
    image: mysql:8.0
    container_name: ninjasage-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ninjasage}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ninjasage_secret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-ninjasage_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ninjasage-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ninjasage}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-ninjasage_secret}
      SWF_ASSETS_PATH: /var/www/swf-assets
      ENEMY_SWF_PATH: /var/www/swf-assets/enemy
      SKILL_SWF_PATH: /var/www/swf-assets/skills
      PVP_SOCKET_URL: ${PVP_SOCKET_URL:-http://localhost:3000/pvp}
      CHAT_SOCKET_URL: ${CHAT_SOCKET_URL:-http://localhost:3002}
      CHAT_INTERNAL_URL: http://chat-server:3002
      CHAT_ADMIN_SECRET: ${CHAT_ADMIN_SECRET:-change-me-to-a-random-secret}
    volumes:
      - ./Database/Laragon/ninjasage:/var/www/html
      - ./Custom Client/NS Custom Client V1:/var/www/swf-assets:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: ninjasage-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Database/Laragon/ninjasage:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  pvp-server:
    image: node:20-alpine
    container_name: ninjasage-pvp
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_DATABASE:-ninjasage}
      DB_USER: root
      DB_PASS: ${DB_PASSWORD:-ninjasage_secret}
    ports:
      - "${PVP_PORT:-3000}:3000"
    volumes:
      - ./Database/Laragon/ninjasage/pvp-server:/app
      - ./Database/Laragon/ninjasage/public/game_data:/game_data:ro
      - ./Database/Laragon/ninjasage/bindata:/bindata:ro
    command: sh -c "[ -d node_modules ] || npm install; node index.js"

  chat-server:
    image: node:20-alpine
    container_name: ninjasage-chat
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_DATABASE:-ninjasage}
      DB_USER: root
      DB_PASS: ${DB_PASSWORD:-ninjasage_secret}
      CHAT_ADMIN_SECRET: ${CHAT_ADMIN_SECRET:-change-me-to-a-random-secret}
    ports:
      - "${CHAT_PORT:-3002}:3002"
    volumes:
      - ./Database/Laragon/ninjasage/chat-server:/app
    command: sh -c "[ -d node_modules ] || npm install; node index.js"

volumes:
  mysql_data:
